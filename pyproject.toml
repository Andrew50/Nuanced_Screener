[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuanced-screener"
version = "0.1.0"
description = "Local market-data and ML screening pipeline with Parquet, DuckDB, and leakage-aware TCN/LightGBM models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=0.10.0",
  "pandas>=2.1.0",
  "pyarrow>=14.0.0",
  "pandas_market_calendars>=4.4.0",
  "requests>=2.31.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "yfinance>=0.2.36",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]
ml = [
  # Back-compat meta extra (kept intentionally small).
  "torch>=2.0",
]
ml_torch = [
  "torch>=2.0",
]
ml_classic = [
  "scikit-learn",
  "lightgbm",
  "hmmlearn",
  "scipy",
]
ui = [
  "streamlit>=1.32",
  "matplotlib>=3.8",
]
vision = [
  "openai>=1.40",
  "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
screener_loader = ["vision/response_schema.json"]

[project.scripts]
ns = "screener_loader.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Keep CI lint minimal: catch real errors without mass style rewrites.
select = [
  "E",
  "F",
]
ignore = [
  "E501",
  "E741",  # OHLCV code commonly uses `l` for low
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E", "F"]
